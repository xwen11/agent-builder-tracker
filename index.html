<script>
  (() => {
    const q = new URLSearchParams(window.location.search);
    const param = q.get("clawpilotTheme") || q.get("scoutTheme");
    const theme =
      param || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");

  })();

<script>
const STORE_KEY = "generic-migration-tracker:" + location.pathname;
const COLOR_VARS = { green: "--m-success", amber: "--m-warning", rose: "--m-rose", blue: "--m-link", red: "--m-danger", gray: "--cp-border-strong" };
const PROGRESS = [
  { key: "design", label: "Design", color: "gray" },
  { key: "implementation", label: "Implementation", color: "blue" },
  { key: "bugbash", label: "Bug bash", color: "amber" },
  { key: "rollout", label: "Rollout", color: "green" },
];
const LEGACY_PROGRESS = { "not-started": "design", "on-track": "implementation", "at-risk": "implementation", blocked: "implementation", done: "rollout" };
const uid = () => Math.random().toString(36).slice(2, 9);
const cv = (c) => `var(${COLOR_VARS[c] || "--m-accent"})`;
const today = () => new Date().toISOString().slice(0, 10);

function defaultState() { return baseState(); }

function baseState() {
  return {
    schemaVersion: 4,
    title: "Product migration tracker",
    subtitle: "Compare source and target capabilities, preview availability, and release scope.",
    notes: "Sample data only. Availability and release commitments must be entered explicitly.",
    headers: { capability: "Capability", category: "Category" },
    badges: [
      { key: "available", label: "Available", color: "green" },
      { key: "partial", label: "Partial", color: "amber" },
      { key: "out", label: "Out of scope", color: "gray" },
    ],
    hosts: [
      { id: "ab", name: "Source product", sub: "Current experience", color: "green" },
      { id: "mcs", name: "Target product", sub: "Migration destination", color: "rose" },
      { id: "spo", name: "Other host", sub: "Separate integration", color: "blue" },
    ],
    sections: [
      { id: "secA", kind: "map", title: "A - Source to target mapping", sub: "Capabilities to migrate.", rows: [
        { id: "example-feature", name: "Example feature", desc: "Replace this fictional example with your own feature.",
          category: "Example", type: "port", release: "", cells: {}, dris: [],
          progress: { status: "design", percent: 0, target: "", updates: [] } },
      ] },
      { id: "secB", kind: "ga", title: "B - Existing target capabilities", sub: "Capabilities to preserve.", rows: [] },
      { id: "secSp", kind: "sp", title: "Other host", sub: "Independent integrations.", rows: [] },
    ],
    tabLabels: {}, comms: [], ltAsks: [], digests: [], bugBashes: [],
  };
}

let state = load();
let openRowId = null;
let onlyBlocked = false;

function load() {
  try { const s = localStorage.getItem(STORE_KEY); if (s) return JSON.parse(s); } catch {}
  try { const seed = JSON.parse(document.getElementById("seed").textContent); if (seed) return seed; } catch {}
  return defaultState();
}
function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch {} remoteSave(); }
function commit() { save(); render(); if (openRowId) renderDrawer(); }

// ---- Joust shared storage (one record in the "tracker" collection) ----
const API = "/api/data/tracker";
const remote = { on: false, id: null, seen: null, readOnly: false, timer: null, saving: false, me: null };
function setSync(cls, text, title = "") { const s = document.getElementById("sync"); s.className = "sync " + cls; s.textContent = text; s.title = title; }
const itemsOf = (j) => Array.isArray(j) ? j : (j && (j.items || j.value)) || [];
async function remoteFetch() {
  const r = await fetch(API + "?sort=updatedAt:desc&limit=1", { headers: { Accept: "application/json" } });
  if (!r.ok || !(r.headers.get("content-type") || "").includes("json")) throw new Error("HTTP " + r.status);
  return itemsOf(await r.json())[0] || null;
}
function remoteSave() {
  if (!remote.on || remote.readOnly) return;
  setSync("busy", "● Saving…"); clearTimeout(remote.timer); remote.timer = setTimeout(remotePush, 700);
}
async function remotePush() {
  if (remote.saving) { remote.timer = setTimeout(remotePush, 300); return; }
  remote.saving = true;
  try {
    if (remote.id) {
      const latest = await remoteFetch();
      if (latest && latest.updatedAt !== remote.seen && latest.id === remote.id) {
        if (!confirm(`${latest.editedBy || latest.owner || "Someone"} changed the tracker since you loaded it.\n\nOK = overwrite with your version\nCancel = discard your change and load theirs`)) {
          applyRemote(latest); return;
        }
      }
    }
    const body = JSON.stringify({ doc: state, editedBy: remote.me?.name || remote.me?.upn || "" });
    const r = await fetch(remote.id ? `${API}/${remote.id}` : API, { method: remote.id ? "PUT" : "POST", headers: { "Content-Type": "application/json" }, body });
    if (r.status === 403) { remote.readOnly = true; setSync("err", "● Read-only", "You can view but not edit this shared tracker"); toast("Read-only: your change was not saved"); return; }
    if (!r.ok) throw new Error("HTTP " + r.status);
    const rec = await r.json(); remote.id = rec.id || remote.id; remote.seen = rec.updatedAt;
    setSync("ok", "● Saved to Joust", "Last saved " + new Date(rec.updatedAt || Date.now()).toLocaleTimeString());
  } catch (e) { setSync("err", "● Save failed — retrying", String(e)); remote.timer = setTimeout(remotePush, 5000); }
  finally { remote.saving = false; }
}
function applyRemote(rec) {
  remote.id = rec.id; remote.seen = rec.updatedAt;
  if (rec.doc && rec.doc.sections) { const v0 = rec.doc.schemaVersion || 1; state = rec.doc; try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch {} render(); if (openRowId) renderDrawer(); if (v0 < (state.schemaVersion || 1) && !remote.readOnly) setTimeout(save, 0); }
  setSync(remote.readOnly ? "err" : "ok", remote.readOnly ? "● Read-only" : "● Synced", rec.editedBy ? `Last edited by ${rec.editedBy} at ${new Date(rec.updatedAt).toLocaleString()}` : "");
}
const busyEditing = () => { const a = document.activeElement; return remote.saving || remote.timer && document.getElementById("sync").classList.contains("busy") || (a && (a.isContentEditable || /INPUT|TEXTAREA|SELECT/.test(a.tagName))); };
async function remoteInit() {
  if (location.protocol === "file:") return;
  try {
    const rec = await remoteFetch();
    remote.on = true;
    remote.me = await fetch("/api/userinfo").then((r) => r.ok ? r.json() : null).catch(() => null);
    if (rec) applyRemote(rec); else { setSync("busy", "● Creating shared copy…"); await remotePush(); }
    setInterval(async () => {
      if (busyEditing() || document.hidden) return;
      try { const rec = await remoteFetch(); if (rec && rec.updatedAt !== remote.seen) { applyRemote(rec); toast(`Updated by ${rec.editedBy || "a teammate"}`); } } catch {}
    }, 15000);
  } catch { setSync("", "● Local only", "Not hosted on Joust — changes stay in this browser"); }
}
function toast(msg) { const t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 1600); }

function findRow(id) { for (const s of state.sections) { const r = s.rows.find((x) => x.id === id); if (r) return { sec: s, row: r }; } return {}; }
function badgeDef(k) { return state.badges.find((b) => b.key === k); }
function progDef(k) { return PROGRESS.find((p) => p.key === k) || PROGRESS[0]; }
const PHASE_ST = [
  { key: "not-started", label: "Not started", color: "gray", icon: "" },
  { key: "on-track", label: "On track", color: "blue", icon: "●" },
  { key: "completed", label: "Completed", color: "green", icon: "✓" },
  { key: "blocked", label: "Blocked", color: "red", icon: "✕" },
];
const phDef = (k) => PHASE_ST.find((x) => x.key === k) || PHASE_ST[0];
function ensurePhases(r) {
  const P = r.progress;
  if (!P.phases) {
    const idx = Math.max(0, PROGRESS.findIndex((p) => p.key === P.status));
    const started = idx > 0 || (+P.percent || 0) > 0;
    P.phases = Object.fromEntries(PROGRESS.map((p, i) => [p.key, { status:
      i < idx || (P.percent === 100 && i === idx) ? "completed" : i === idx && started ? "on-track" : "not-started", target: "", note: "" }]));
    if (P.bugBash) P.phases.bugbash.target = P.bugBash;
  }
  for (const p of PROGRESS) P.phases[p.key] ||= { status: "not-started", target: "", note: "" };
}
function syncPhases(r) {
  const P = r.progress, ph = P.phases;
  const done = PROGRESS.filter((p) => ph[p.key].status === "completed").length;

    [["Total", all.length], ["Drafts", all.filter((c) => c.status === "draft" || c.status === "review").length],
     ["Scheduled", all.filter((c) => c.status === "scheduled").length], ["Sent", all.filter((c) => c.status === "sent").length],
     ["Next 7 days", all.filter((c) => c.status !== "sent" && c.date >= t0 && (new Date(c.date) - new Date(t0)) / 864e5 <= 7).length]]
      .map(([k, n]) => el("div", { class: "stat" }, el("div", { class: "k" }, k), el("div", { class: "v" }, n)))));
  const q = el("input", { placeholder: "Search title, audience, owner…", value: commFilter.q, style: "width:260px" });
  q.oninput = () => { commFilter.q = q.value; drawTable(); };
  const st = el("select", {}, el("option", { value: "" }, "All statuses"), COMM_STATUS.map(([k, l]) => el("option", { value: k, selected: commFilter.status === k }, l)));
  st.onchange = () => { commFilter.status = st.value; drawTable(); };
  const suggest = el("button", { title: "Create a draft invite for each upcoming bug bash that doesn't have one", onclick: () => {
    let n = 0;
    for (const b of state.bugBashes) if (b.date && b.date >= today() && !state.comms.some((c) => c.bbId === b.id)) {
      const d = new Date(b.date + "T00:00:00"); d.setDate(d.getDate() - 5);
      state.comms.push({ id: uid(), date: d.toISOString().slice(0, 10), type: "Bug bash invite", title: "Invite: " + b.title, audience: "Feature crews + PMs",
        channel: "Email + Teams", owner: b.owner, status: "draft", link: b.link, notes: "", bbId: b.id }); n++;
    }
    commit(); toast(n ? `Added ${n} draft invite(s)` : "Every upcoming bug bash already has an invite");
  } }, "Draft bug bash invites");
  v.append(el("div", { class: "filters" }, q, st, el("span", { style: "flex:1" }), suggest));
  const box = el("div"); v.append(box);
  function drawTable() {
    const ql = commFilter.q.toLowerCase();
    const list = all.filter((c) => (!commFilter.status || c.status === commFilter.status) &&
      (!ql || [c.title, c.audience, c.owner, c.channel, c.type, c.notes].join(" ").toLowerCase().includes(ql)))
      .sort((a, b) => (a.date || "9999").localeCompare(b.date || "9999"));
    if (!all.length) { box.replaceChildren(el("div", { class: "empty" }, "No communications yet — click “+ Communication” or “Draft bug bash invites”.")); return; }
    const head = ["Date", "Type", "Title / message", "Audience", "Channel", "Owner", "Status", "Link", "Notes", ""];
    box.replaceChildren(el("table", { class: "comms" },
      el("tr", {}, head.map((h) => el("th", {}, h))),
      list.map((c) => el("tr", { class: c.status === "sent" ? "sent" : "" },
        el("td", { style: "width:130px" }, inp(c, "date", { type: "date" }, commit)),
        el("td", { style: "width:140px" }, sel(c, "type", COMM_TYPES.includes(c.type) ? COMM_TYPES.map((x) => [x, x]) : [[c.type, c.type], ...COMM_TYPES.map((x) => [x, x])])),
        el("td", {}, inp(c, "title", { placeholder: "What are we communicating?", style: "font-weight:700" })),
        el("td", { style: "width:150px" }, inp(c, "audience", { placeholder: "e.g. Leadership" })),
        el("td", { style: "width:120px" }, inp(c, "channel", { placeholder: "Email / Teams" })),
        el("td", { style: "width:120px" }, inp(c, "owner", { placeholder: "Owner" })),
        el("td", { style: "width:120px" }, sel(c, "status", COMM_STATUS, commit)),
        el("td", { style: "width:150px" }, el("div", { style: "display:flex;gap:4px" }, inp(c, "link", { placeholder: "URL" }, commit), c.link ? el("a", { class: "btn", href: c.link, target: "_blank", rel: "noopener" }, "↗") : null)),
        el("td", {}, inp(c, "notes", { tag: "textarea", rows: 1 })),
        el("td", { style: "width:34px" }, el("button", { class: "icon", title: "Delete", onclick: () => { if (confirm(`Delete "${c.title || "this item"}"?`)) { state.comms = state.comms.filter((x) => x !== c); commit(); } } }, "✕")))),
    ));
  }
  drawTable();
  renderDigests(v);
}
function listEditor(arr, ph) {
  const box = el("div", { class: "dlist" });
  arr.forEach((txt, i) => {
    const ta = el("textarea", { rows: 1 }); ta.value = txt;
    const fit = () => { ta.style.height = "auto"; ta.style.height = ta.scrollHeight + 2 + "px"; };
    ta.oninput = fit; requestAnimationFrame(fit);
    ta.onchange = () => { arr[i] = ta.value; save(); };
    box.append(el("div", { class: "di" }, el("span", { class: "b" }, "•"), ta,
      el("button", { class: "icon", title: "Remove", onclick: () => { arr.splice(i, 1); commit(); } }, "✕")));
  });
  box.append(el("button", { class: "add", onclick: () => { arr.push(""); commit(); } }, "+ " + ph));
  return box;
}
function renderDigests(v) {
  const head = el("div", { style: "display:flex;align-items:center;gap:8px" },
    el("h2", { class: "sh", style: "flex:1" }, "Meeting digests & key decisions"),
    el("button", { onclick: () => { state.digests.unshift({ id: uid(), title: "New meeting digest", period: "", link: "", summary: "", decisions: [], actions: [], open: [] }); commit(); } }, "+ Digest"));
  v.append(head, el("div", { class: "dg-grid" }, state.digests.map((d) => {
    const link = inp(d, "link", { placeholder: "Teams chat / recording link" });
    return el("details", { class: "card dg", open: true },
      el("summary", { class: "card-h" },
        inp(d, "title", { class: "t", "aria-label": "Digest title" }),
        el("span", { class: "pill", style: "--bc:var(--m-accent)" }, `${d.decisions.length} decisions`),
        el("button", { class: "icon", title: "Delete digest", onclick: (e) => { e.preventDefault(); if (confirm(`Delete "${d.title}"?`)) { state.digests = state.digests.filter((x) => x !== d); commit(); } } }, "✕")),
      el("div", { class: "row2" }, field("Period", inp(d, "period", { placeholder: "e.g. Oct 6 – Oct 13" })),
        field("Source", el("div", { style: "display:flex;gap:6px" }, link, d.link ? el("a", { class: "btn", href: d.link, target: "_blank", rel: "noopener" }, "Open chat") : null))),
      field("Summary", inp(d, "summary", { tag: "textarea", rows: 3 })),
      el("label", { class: "f dh dec" }, "✔ Key decisions"), listEditor(d.decisions, "Decision"),
      el("label", { class: "f dh" }, "→ Action items / status"), listEditor(d.actions, "Action item"),
      el("label", { class: "f dh" }, "? Open questions"), listEditor(d.open, "Open question"));
  })));
}
function renderLt() {
  const v = document.getElementById("view-lt"); v.replaceChildren();
  v.append(comparisonLegend(), el("div", { id: "lt-comparison" }));
  renderComparison();
  v.append(el("h2", {}, `Leadership asks (${state.ltAsks.length})`));
  const pri = (a) => { const i = LT_PRI.findIndex((p) => p[0] === a.priority); return i < 0 ? 9 : i; };
  if (!state.ltAsks.length) v.append(el("div", { class: "empty" }, "Nothing needs LT attention yet — click “+ LT ask”."));
  else v.append(el("div", { class: "lt-grid" }, state.ltAsks.slice().sort((x, y) => pri(x) - pri(y)).map(ltCard)));
}
function ltCard(a) {
  const p = LT_PRI.find((x) => x[0] === a.priority) || LT_PRI[2];
  return el("div", { class: "card lt", style: `--pc:${cv(p[2])}` },
    el("div", { class: "lt-row" },
      sel(a, "priority", LT_PRI, commit),
      inp(a, "ask", { tag: "textarea", rows: 3, placeholder: "What do we need from LT?", "aria-label": "Ask" }),
      el("button", { class: "icon", title: "Delete ask", onclick: () => { if (confirm("Delete this ask?")) { state.ltAsks = state.ltAsks.filter((x) => x !== a); commit(); } } }, "✕")),
    el("div", { class: "lt-dec" + (a.decision ? " has" : "") },
      el("span", { class: "lt-dec-lbl" }, "↳ LT decision"),
      inp(a, "decision", { tag: "textarea", rows: 1, placeholder: "Pending — record LT's decision here", "aria-label": "LT decision" })));
}
document.getElementById("addLt").onclick = () => {
  state.ltAsks.push(newLt()); commit();
  setTimeout(() => { [...document.querySelectorAll('#view-lt textarea[aria-label="Ask"]')].find((t) => !t.value)?.focus(); }, 0);
};document.getElementById("addBB").onclick = () => {
  const d = new Date(); d.setDate(d.getDate() + 14);
  state.bugBashes.push({ id: uid(), title: "New bug bash", date: d.toISOString().slice(0, 10), capIds: [], status: "planned", owner: "", link: "", found: 0, fixed: 0, notes: "" });
  commit(); toast("Bug bash added — set its date and add capabilities");
};
document.getElementById("addComm").onclick = () => {
  state.comms.push({ id: uid(), date: today(), type: "Status update", title: "", audience: "", channel: "", owner: remote.me?.name || "", status: "draft", link: "", notes: "" });
  commit(); setTimeout(() => document.querySelector("#view-comms table.comms tr:last-child td:nth-child(3) input, #view-comms table.comms input[placeholder^='What']")?.focus(), 0);
};
window.addEventListener("hashchange", () => { const k = location.hash.slice(1); if (TABS.some((t) => t.key === k) && k !== tab) setTab(k); });

// Toolbar
for (const m of document.querySelectorAll(".menu")) {
  m.querySelector(".menu-btn").onclick = (ev) => { ev.stopPropagation(); const o = m.classList.contains("open"); document.querySelectorAll(".menu.open").forEach((x) => x.classList.remove("open")); if (!o) m.classList.add("open"); };
  m.querySelector(".menu-list").addEventListener("click", () => m.classList.remove("open"));
}
document.addEventListener("click", () => document.querySelectorAll(".menu.open").forEach((x) => x.classList.remove("open")));
document.addEventListener("keydown", (e) => { if (e.key === "Escape") document.querySelectorAll(".menu.open").forEach((x) => x.classList.remove("open")); });
document.getElementById("addSection").onclick = () => {
  const kind = confirm("OK = Section A type (Source product → Target product mapping)\nCancel = Section B type (Target product GA, no regression)") ? "map" : "ga";
  state.sections.push({ id: uid(), kind, title: "New section", sub: "", rows: [] }); commit(); toast("Section added — double-click its title to rename");
};
const addCap = (kind, title) => {
  let sec = state.sections.find((s) => secKind(s) === kind);
  if (!sec) state.sections.push(sec = { id: uid(), kind, title, sub: "", rows: [] });
  addRow(sec);
};
document.getElementById("addCapA").onclick = () => addCap("map", "A · Source product → Target product mapping");
document.getElementById("addCapB").onclick = () => addCap("ga", "B · Target product GA — must not regress");
document.getElementById("addCapSp").onclick = () => addCap("sp", "Other host");
const download = (name, text, type) => { const a = el("a", { href: URL.createObjectURL(new Blob([text], { type })), download: name }); document.body.append(a); a.click(); a.remove(); };
document.getElementById("exportJson").onclick = () => download(`ab-tracker-${today()}.json`, JSON.stringify(state, null, 2), "application/json");
document.getElementById("importJson").onclick = () => document.getElementById("fileIn").click();
document.getElementById("fileIn").onchange = async (e) => {
  const f = e.target.files[0]; if (!f) return;
  try { const s = JSON.parse(await f.text()); if (!s.sections || !s.hosts) throw new Error("Not a tracker file"); state = s; commit(); toast("Imported"); }
  catch (err) { alert("Import failed: " + err.message); }
  e.target.value = "";
};
document.getElementById("saveHtml").onclick = () => {
  closeDrawer(); closePop();
  const seed = document.getElementById("seed");
  const prev = seed.textContent;
  seed.textContent = JSON.stringify(state).replace(/</g, "\\u003c");
  const html = "<!doctype html>\n" + document.documentElement.outerHTML;
  seed.textContent = prev;
  download(`migration-tracker-${today()}.html`, html, "text/html");
  toast("Snapshot saved — share this file to give others the current state");
};
document.getElementById("reset").onclick = () => {
  if (!confirm("Reset to the original table? All DRIs, progress, and edits will be lost" + (remote.on ? " for EVERYONE using this shared tracker" : " in this browser") + " (export first if needed).")) return;
  localStorage.removeItem(STORE_KEY); state = (() => { try { return JSON.parse(document.getElementById("seed").textContent) || defaultState(); } catch { return defaultState(); } })(); commit();
};

render();
remoteInit();
</script>
